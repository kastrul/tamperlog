# Local PostgreSQL for the integration tests:
#   docker compose up -d            (host port: TAMPERLOG_PG_PORT, default 55433)
#   export TAMPERLOG_PG_DSN=postgres://tamperlog:tamperlog@localhost:55433/tamperlog?sslmode=disable
#   go test -race -tags integration ./...
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: tamperlog
      POSTGRES_PASSWORD: tamperlog
      POSTGRES_DB: tamperlog
    ports:
      - "${TAMPERLOG_PG_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tamperlog"]
      interval: 5s
      timeout: 5s
      retries: 10
